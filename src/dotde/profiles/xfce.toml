[meta]
id = "xfce"
name = "XFCE"
version_cmd = ["xfce4-session", "--version"]
running_process = "xfce4-session"
# xfconfd and the panel save their state at logout: files can only be restored from
# outside the session (TTY).
restore_mode = "offline"
logout_cmd = ["xfce4-session-logout", "--logout"]

[[category]]
id = "panel"
label = { en = "Panel", it = "Pannello" }
paths = ["~/.config/xfce4/panel/", "~/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml"]

[[category]]
id = "appearance"
label = { en = "Appearance, desktop and window manager", it = "Aspetto, desktop e gestione finestre" }
paths = [
    "~/.config/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml",
    "~/.config/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml",
    "~/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml",
]

[[category]]
id = "shortcuts"
label = { en = "Keyboard shortcuts", it = "Scorciatoie da tastiera" }
paths = ["~/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-keyboard-shortcuts.xml"]

[[category]]
id = "system"
label = { en = "Power, session, notifications and input", it = "Energia, sessione, notifiche e input" }
paths = [
    "~/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-power-manager.xml",
    "~/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-session.xml",
    "~/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-notifyd.xml",
    "~/.config/xfce4/xfconf/xfce-perchannel-xml/keyboard-layout.xml",
    "~/.config/xfce4/xfconf/xfce-perchannel-xml/keyboards.xml",
    "~/.config/xfce4/xfconf/xfce-perchannel-xml/pointers.xml",
]

[[category]]
id = "thunar"
label = { en = "Thunar file manager", it = "File manager Thunar" }
paths = ["~/.config/Thunar/", "~/.config/xfce4/xfconf/xfce-perchannel-xml/thunar.xml"]

[[category]]
id = "terminal"
label = { en = "XFCE Terminal", it = "Terminale XFCE" }
paths = ["~/.config/xfce4/terminal/", "~/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-terminal.xml"]
